services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: catalogo
      POSTGRES_USER: catalogo
      POSTGRES_PASSWORD: catalogo
    volumes:
      - catalogo_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogo -d catalogo"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    environment:
      APP_PORT: 8080
      DATABASE_URL: postgres://catalogo:catalogo@db:5432/catalogo?sslmode=disable
      MIGRATIONS_DIR: /app/backend/migrations
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  catalogo_pgdata:
