# Entorno de demostración independiente de las pruebas y del parcial anterior.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: catalogo_desk_demo
      POSTGRES_USER: catalogo
      POSTGRES_PASSWORD: catalogo
    volumes:
      - desk_demo_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U catalogo -d catalogo_desk_demo"]
      interval: 3s
      timeout: 3s
      retries: 30
  api:
    build: .
    environment:
      DATABASE_URL: postgres://catalogo:catalogo@db:5432/catalogo_desk_demo?sslmode=disable
      MIGRATIONS_DIR: /app/backend/migrations
      APP_PORT: 8080
      ATTACHMENTS_DIR: /app/storage/attachments
    volumes:
      - desk_demo_attachments:/app/storage/attachments
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18091:8080"
  frontend:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "18090:80"
volumes:
  desk_demo_data:
  desk_demo_attachments:
